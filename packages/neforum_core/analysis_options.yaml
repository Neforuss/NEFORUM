include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: warning
    unused_local_variable: warning

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - avoid_dynamic_calls
    - directives_ordering
    - sort_pub_dependencies
