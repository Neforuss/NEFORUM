name: neforum_core
description: >-
  Platform-agnostic core of NEFORUM, the free and open-source cross-poster:
  data model, platform adapters, text adaptation, quota tracking, scheduling
  logic and hand-off (share intent) planning. Pure Dart, no Flutter dependency.
version: 0.1.0
repository: https://github.com/Neforuss/NEFORUM
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  archive: ^4.5.2
  bech32: ^0.2.2
  bip340: ^0.3.1
  characters: ^1.4.0
  collection: ^1.19.0
  convert: ^3.1.0
  crypto: ^3.0.0
  cryptography: ^2.9.0
  http: ^1.5.0
  http_parser: ^4.0.0
  image: ^4.10.1
  meta: ^1.16.0
  mime: ^2.0.0
  path: ^1.9.0
  unorm_dart: ^0.3.3
  uuid: ^4.5.0
  web_socket_channel: ^3.0.0
  xml: ^6.5.0

dev_dependencies:
  lints: ^5.0.0
  # CommonMark rendering for test/characters/kaomoji_test.dart: the kaomoji a
  # Markdown network gets must render back to themselves.
  markdown: ^7.3.0
  test: ^1.25.0
  yaml: ^3.1.0

# The character catalog (symbols, text styles, emoji keywords), generated by
# tool/generate_character_catalog.dart from pinned Unicode files. Pure Dart
# code reads it with any loader; the Flutter app gets it as
# packages/neforum_core/assets/characters/... through this section, which
# plain `dart` ignores.
flutter:
  assets:
    - assets/characters/
