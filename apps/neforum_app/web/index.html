<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NEFORUM: one app, one message, every platform. A free and open-source cross-poster. This is the web preview with a demo workspace.">
  <meta name="theme-color" content="#0B0C10">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NEFORUM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NEFORUM</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root { color-scheme: dark light; }
    html, body { margin: 0; height: 100%; background: #0B0C10; }
    @media (prefers-color-scheme: light) { html, body { background: #F4F3EF; } }
    /* Shown until Flutter paints its first frame. */
    #splash { position: fixed; inset: 0; display: grid; place-items: center; }
    #splash .mark {
      width: 72px; height: 72px; border-radius: 22px;
      background: linear-gradient(135deg, #7C5CFF 0%, #FF4D8D 55%, #FF9F43 100%);
      box-shadow: 0 18px 40px -16px rgba(124, 92, 255, .6);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.94); opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { #splash .mark { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading NEFORUM"><div class="mark"></div></div>
  <script>
    // Remove the splash once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
