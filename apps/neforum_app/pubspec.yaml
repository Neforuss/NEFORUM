name: neforum_app
description: >-
  NEFORUM: one app, one message, every platform. Free and open-source
  cross-poster for Android, iOS, macOS and Windows.
publish_to: 'none'
version: 1.2.3+20

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  neforum_core:
    path: ../../packages/neforum_core

  # State and navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Platform integration
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  desktop_drop: ^0.8.4
  window_manager: ^0.5.2
  tray_manager: ^0.8.0
  nativeapi: ^0.5.2
  path_provider: ^2.1.6
  package_info_plus: any
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1

  # UI
  font_awesome_flutter: any
  flutter_markdown_plus: any
  intl: any

  # Utilities
  collection: ^1.19.0
  cross_file: any
  image: ^4.10.1
  mime: ^2.1.0
  path: ^1.9.0
  uuid: ^4.6.0

  # Document ingest (lib/documents/): DOCX and EPUB are ZIP packages of XML
  # (tool/build_extension.dart also zips the browser extension with
  # archive), web pages and EPUB chapters are read with html, Markdown is
  # turned into HTML first, and PDF text, layout and page rendering come from
  # PDFium (pdfrx, with pdfium_dart for the calls pdfrx does not wrap).
  archive: ^4.4.0
  xml: ^6.6.1
  pdfrx: ^2.10.1
  pdfium_dart: ^0.4.0
  ffi: ^2.2.0
  html: ^0.15.7
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # test_driver/integration_test.dart: integration tests on a profile build.
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/brand/
    # Each platform's own icon (see assets/platforms/SOURCES.md).
    - assets/platforms/
    - assets/tray/
    - assets/docs/
    # The browser extension, built by tool/build_extension.dart, shipped so
    # Settings > Browser extension can show its folder for installing.
    - assets/browser-extension/chrome/
    - assets/browser-extension/chrome/content/
    - assets/browser-extension/chrome/icons/
    - assets/browser-extension/chrome/popup/
    - assets/browser-extension/firefox/
    - assets/browser-extension/firefox/content/
    - assets/browser-extension/firefox/icons/
    - assets/browser-extension/firefox/popup/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
    # TikTok's own typeface (variable: weights are set with FontVariation).
    - family: TikTok Sans
      fonts:
        - asset: assets/fonts/TikTokSans.ttf
