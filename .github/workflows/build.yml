name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # PDFium comes from a GitHub release download in pdfium_dart's build hook,
      # which skips it when the library is already in the shared hook output: a
      # 504 from GitHub's download server once failed six jobs of the v1.4.2 tag run.
      - name: Cache PDFium (pdfium_dart build hook)
        uses: actions/cache@v4
        with:
          path: apps/neforum_app/.dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/neforum_app/pubspec.lock') }}
      - name: CI scripts - network retry cases
        working-directory: apps/neforum_app
        run: bash tool/retry_on_network_test.sh
      - name: Core - analyze and test
        working-directory: packages/neforum_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      # Real zones with a midnight change and a 30-minute change, which Windows
      # cannot switch a process to. The first test proves TZ took effect.
      - name: Core - random schedule under other time zones
        working-directory: packages/neforum_core
        run: |
          TZ=America/Havana dart test test/random_moment_real_zone_test.dart
          TZ=Australia/Lord_Howe dart test test/random_moment_real_zone_test.dart
      - name: Linux packages for the tray plugin's build hook
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      # pdfium_dart's build hook downloads PDFium from a GitHub release address
      # that answered 504 for an hour on 2026-11-09 (six failed jobs of the
      # v1.4.2 tag run). This puts the libraries where the hook looks first,
      # through the GitHub API with retries: see tool/prefetch_pdfium.sh.
      - name: PDFium for the build hook (GitHub API, retried)
        working-directory: apps/neforum_app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: flutter pub get > /dev/null && bash tool/prefetch_pdfium.sh linux-x64 || echo "::warning::PDFium prefetch failed; the build hook will try its own download"
      - name: App - analyze and test
        working-directory: apps/neforum_app
        run: |
          flutter pub get
          dart run tool/sync_docs.dart
          flutter analyze --fatal-infos
          flutter test --exclude-tags screenshots --file-reporter json:test-report.json
      - name: Report failed app tests
        if: failure()
        working-directory: apps/neforum_app
        run: dart run tool/report_test_failures.dart test-report.json

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle's downloads (the Kotlin compiler comes from a GitHub release)
          # are kept between runs: fewer chances for a download outage to fail a build.
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # PDFium comes from a GitHub release download in pdfium_dart's build hook,
      # which skips it when the library is already in the shared hook output: a
      # 504 from GitHub's download server once failed six jobs of the v1.4.2 tag run.
      - name: Cache PDFium (pdfium_dart build hook)
        uses: actions/cache@v4
        with:
          path: apps/neforum_app/.dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/neforum_app/pubspec.lock') }}
      - name: Linux packages for the tray plugin's build hook
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      # Release signing key (docs/signing.md). Without these secrets the APKs
      # are signed with the debug key, as before; switching keys later makes
      # Android refuse the update until the old app is uninstalled once.
      - name: Release signing key
        working-directory: apps/neforum_app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::notice::No Android signing secrets: the APKs are signed with the debug key."
            exit 0
          fi
          # android/app/build.gradle.kts reads android/key.properties; storeFile
          # is relative to android/app. Both names are in android/.gitignore.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/neforum-release.jks
          umask 077
          {
            echo "storeFile=neforum-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          keytool -list -keystore android/app/neforum-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null
          echo "Signing the APKs with the release key (alias $ANDROID_KEY_ALIAS)."
      # pdfium_dart's build hook downloads PDFium from a GitHub release address
      # that answered 504 for an hour on 2026-11-09 (six failed jobs of the
      # v1.4.2 tag run). This puts the libraries where the hook looks first,
      # through the GitHub API with retries: see tool/prefetch_pdfium.sh.
      - name: PDFium for the build hook (GitHub API, retried)
        working-directory: apps/neforum_app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: flutter pub get > /dev/null && bash tool/prefetch_pdfium.sh android-arm android-arm64 android-x64 linux-x64 || echo "::warning::PDFium prefetch failed; the build hook will try its own download"
      # Gradle itself comes from a GitHub release (services.gradle.org redirects
      # there): put it where the wrapper looks first, through the API, retried.
      - name: Gradle for the wrapper (GitHub API, retried)
        working-directory: apps/neforum_app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/prefetch_gradle.sh || echo "::warning::Gradle prefetch failed; the wrapper will try its own download"
      - name: Build APK
        working-directory: apps/neforum_app
        run: |
          flutter pub get
          dart run tool/sync_docs.dart
          flutter build apk --release --dart-define=NEFORUM_MOBILE=true
          cp build/app/outputs/flutter-apk/app-release.apk ../../neforum-android.apk
      # One APK per processor type as well: each is under the 25 MiB per-file
      # limit of the neforus.com download mirror (arm64 fits nearly every
      # phone of the last decade).
      - name: Build per-ABI APKs
        working-directory: apps/neforum_app
        run: |
          flutter build apk --release --split-per-abi --dart-define=NEFORUM_MOBILE=true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../../neforum-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../../neforum-android-armv7.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ../../neforum-android-x86_64.apk
          ls -l ../../neforum-android*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: neforum-android
          path: neforum-android*.apk

  # Does a post the person started still finish after Home and a swipe from Recents?
  # A profile build of integration_test/android_background_probe.dart on an emulator
  # posts to a fake Mastodon on this runner (tool/android_background_probe/). The fake
  # server's log is the proof, printed in this job's log. The limit lane (Android 15+'s
  # time limit for dataSync, shortened to 60 s) is reported, not required, until it has
  # run green on the hosted images.
  android-background:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 34: the oldest with the cached-process rule; 36: ProgressStyle and the limit.
        api-level: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle's downloads (the Kotlin compiler comes from a GitHub release)
          # are kept between runs: fewer chances for a download outage to fail a build.
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # PDFium comes from a GitHub release download in pdfium_dart's build hook,
      # which skips it when the library is already in the shared hook output: a
      # 504 from GitHub's download server once failed six jobs of the v1.4.2 tag run.
      - name: Cache PDFium (pdfium_dart build hook)
        uses: actions/cache@v4
        with:
          path: apps/neforum_app/.dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/neforum_app/pubspec.lock') }}
      - name: Linux packages for the tray plugin's build hook
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # pdfium_dart's build hook downloads PDFium from a GitHub release address
      # that answered 504 for an hour on 2026-11-09 (six failed jobs of the
      # v1.4.2 tag run). This puts the libraries where the hook looks first,
      # through the GitHub API with retries: see tool/prefetch_pdfium.sh.
      - name: PDFium for the build hook (GitHub API, retried)
        working-directory: apps/neforum_app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: flutter pub get > /dev/null && bash tool/prefetch_pdfium.sh android-arm android-arm64 android-x64 linux-x64 || echo "::warning::PDFium prefetch failed; the build hook will try its own download"
      # Gradle itself comes from a GitHub release (services.gradle.org redirects
      # there): put it where the wrapper looks first, through the API, retried.
      - name: Gradle for the wrapper (GitHub API, retried)
        working-directory: apps/neforum_app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/prefetch_gradle.sh || echo "::warning::Gradle prefetch failed; the wrapper will try its own download"
      - name: Build the probe (profile, AOT as shipped)
        working-directory: apps/neforum_app
        run: |
          flutter pub get
          dart run tool/sync_docs.dart
          flutter build apk --profile --target-platform android-x64 -t integration_test/android_background_probe.dart \
            --dart-define=NEFORUM_MOBILE=true --dart-define=NEFORUM_PROBE_SERVER=http://127.0.0.1:8787
          ls -l build/app/outputs/flutter-apk/app-profile.apk
      - name: Home, then the task removed, on API ${{ matrix.api-level }}
        # v2.38.0
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: apps/neforum_app
          script: |
            bash tool/android_background_probe/run_probe.sh swipe
            bash tool/android_background_probe/run_probe.sh limit || echo "::warning::The time limit lane failed on API ${{ matrix.api-level }}: see its lines above"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-background-probe-api${{ matrix.api-level }}
          path: apps/neforum_app/build/android-background-probe/
          if-no-files-found: ignore

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # PDFium comes from a GitHub release download in pdfium_dart's build hook,
      # which skips it when the library is already in the shared hook output: a
      # 504 from GitHub's download server once failed six jobs of the v1.4.2 tag run.
      - name: Cache PDFium (pdfium_dart build hook)
        uses: actions/cache@v4
        with:
          path: apps/neforum_app/.dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/neforum_app/pubspec.lock') }}
      - name: Card design goldens (recorded on Windows)
        working-directory: apps/neforum_app
        shell: pwsh
        # Pixel comparisons depend on the platform's text drawing; a mismatch
        # here is reported but never blocks a release.
        continue-on-error: true
        run: |
          flutter test test/card_design_test.dart
          if ($LASTEXITCODE -ne 0) { Write-Output '::warning::Card design goldens differ on the CI Windows runner'; exit $LASTEXITCODE }
      # pdfium_dart's build hook downloads PDFium from a GitHub release address
      # that answered 504 for an hour on 2026-11-09 (six failed jobs of the
      # v1.4.2 tag run). This puts the libraries where the hook looks first,
      # through the GitHub API with retries: see tool/prefetch_pdfium.sh.
      - name: PDFium for the build hook (GitHub API, retried)
        working-directory: apps/neforum_app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: flutter pub get > /dev/null && bash tool/prefetch_pdfium.sh win-x64 || echo "::warning::PDFium prefetch failed; the build hook will try its own download"
      - name: Integration test (real Windows build and plugins)
        working-directory: apps/neforum_app
        shell: pwsh
        run: |
          flutter pub get
          dart run tool/sync_docs.dart
          # One file at a time: NEFORUM runs once per user, so a test app
          # that starts before the previous one has exited closes at once.
          foreach ($file in Get-ChildItem integration_test -Filter *_test.dart) {
            Get-Process NEFORUM -ErrorAction SilentlyContinue | Wait-Process -Timeout 60
            flutter test "integration_test/$($file.Name)" -d windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Integration test (profile build, AOT-compiled as shipped)
        working-directory: apps/neforum_app
        shell: pwsh
        # A debug build runs on the JIT and never shows AOT compiler faults
        # (1.2.1 crashed on every save in release, but passed the step above).
        run: |
          Get-Process NEFORUM -ErrorAction SilentlyContinue | Wait-Process -Timeout 60
          flutter drive --profile -d windows --driver=test_driver/integration_test.dart --target=integration_test/captions_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Video tools test (profile build, Media Foundation)
        working-directory: apps/neforum_app
        shell: pwsh
        run: |
          Get-Process NEFORUM -ErrorAction SilentlyContinue | Wait-Process -Timeout 60
          flutter drive --profile -d windows --driver=test_driver/integration_test.dart --target=integration_test/video_tools_test.dart | Tee-Object -Variable drive
          $code = $LASTEXITCODE
          # Windows Server runners may lack Media Foundation: then the test only
          # reports SKIPPED, which must show on the run, not pass unnoticed.
          if ($drive -match 'SKIPPED') { Write-Output '::warning::Video tools test skipped: this runner has no Media Foundation encoders' }
          if ($code -ne 0) { exit $code }
      - name: 1.3 release probe (profile build)
        working-directory: apps/neforum_app
        shell: pwsh
        run: |
          Get-Process NEFORUM -ErrorAction SilentlyContinue | Wait-Process -Timeout 60
          flutter drive --profile -d windows --driver=test_driver/integration_test.dart --target=integration_test/release_probe_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audio tags test (profile build)
        working-directory: apps/neforum_app
        shell: pwsh
        run: |
          Get-Process NEFORUM -ErrorAction SilentlyContinue | Wait-Process -Timeout 60
          flutter drive --profile -d windows --driver=test_driver/integration_test.dart --target=integration_test/audio_tags_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Font downloads test (profile build, local fake of the font services)
        working-directory: apps/neforum_app
        shell: pwsh
        run: |
          Get-Process NEFORUM -ErrorAction SilentlyContinue | Wait-Process -Timeout 60
          flutter drive --profile -d windows --driver=test_driver/integration_test.dart --target=integration_test/font_downloads_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Mouse side buttons (profile build, real Windows messages)
        working-directory: apps/neforum_app
        shell: pwsh
        run: |
          Get-Process NEFORUM -ErrorAction SilentlyContinue | Wait-Process -Timeout 60
          flutter drive --profile -d windows --driver=test_driver/integration_test.dart --target=integration_test/back_forward_test.dart | Tee-Object -Variable drive
          $code = $LASTEXITCODE
          # A hosted runner may have no input desktop: PostMessage still runs, but
          # the SendInput lane then only reports SKIPPED, which must show on the run.
          if ($drive -match 'SKIPPED') { Write-Output '::warning::Side button test: the SendInput lane was skipped on this runner' }
          if ($code -ne 0) { exit $code }
      - name: Build Windows
        working-directory: apps/neforum_app
        shell: pwsh
        run: |
          flutter build windows --release
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../../neforum-windows.zip
      - name: Build installer
        working-directory: apps/neforum_app
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          & $iscc "/DAppVersion=$version" installer\neforum.iss
          Copy-Item build\installer\NEFORUM-Setup-*.exe ..\..\
      - name: Browser extension
        working-directory: apps/neforum_app
        shell: pwsh
        run: |
          dart run tool/build_extension.dart
          Copy-Item ..\..\dist\neforum-extension-*.zip ..\..\
      - uses: actions/upload-artifact@v4
        with:
          name: neforum-windows
          path: |
            neforum-windows.zip
            NEFORUM-Setup-*.exe
            neforum-extension-*.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # PDFium comes from a GitHub release download in pdfium_dart's build hook,
      # which skips it when the library is already in the shared hook output: a
      # 504 from GitHub's download server once failed six jobs of the v1.4.2 tag run.
      - name: Cache PDFium (pdfium_dart build hook)
        uses: actions/cache@v4
        with:
          path: apps/neforum_app/.dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/neforum_app/pubspec.lock') }}
      # pdfium_dart's build hook downloads PDFium from a GitHub release address
      # that answered 504 for an hour on 2026-11-09 (six failed jobs of the
      # v1.4.2 tag run). This puts the libraries where the hook looks first,
      # through the GitHub API with retries: see tool/prefetch_pdfium.sh.
      - name: PDFium for the build hook (GitHub API, retried)
        working-directory: apps/neforum_app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: flutter pub get > /dev/null && bash tool/prefetch_pdfium.sh mac-arm64 mac-x64 || echo "::warning::PDFium prefetch failed; the build hook will try its own download"
      - name: Build macOS
        working-directory: apps/neforum_app
        run: |
          flutter pub get
          dart run tool/sync_docs.dart
          flutter build macos --release
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent NEFORUM.app "$GITHUB_WORKSPACE/neforum-macos.zip"
          # The usual Mac install: a disk image with the app and a shortcut to
          # Applications, so NEFORUM is dragged there and shows up in
          # Launchpad and Spotlight like any other app.
          mkdir -p dmg
          cp -R NEFORUM.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname NEFORUM -srcfolder dmg -ov -format UDZO "$GITHUB_WORKSPACE/NEFORUM-macOS.dmg"
      # The same app for one processor each (Apple silicon, Intel): about half
      # the size, so each fits the 25 MiB per-file limit of the neforus.com
      # download mirror. Thinning breaks the ad-hoc signature, so the app is
      # signed again ad hoc with its own entitlements (sandbox included, so it
      # keeps the same data folder as the universal build).
      - name: Build Apple silicon and Intel downloads
        continue-on-error: true
        working-directory: apps/neforum_app/build/macos/Build/Products/Release
        run: |
          ent="$GITHUB_WORKSPACE/apps/neforum_app/macos/Runner/Release.entitlements"
          thin() {
            arch="$1"; label="$2"; out="thin-$label"
            rm -rf "$out" && mkdir -p "$out/dmg"
            cp -R NEFORUM.app "$out/dmg/"
            app="$out/dmg/NEFORUM.app"
            find "$app" -type f | while read -r f; do
              archs="$(lipo -archs "$f" 2>/dev/null || true)"
              case "$archs" in
                *" "*) lipo "$f" -thin "$arch" -output "$f.thin" && cat "$f.thin" > "$f" && rm "$f.thin" ;;
              esac
            done
            find "$app/Contents/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \;
            codesign --force --sign - --entitlements "$ent" "$app"
            codesign --verify --deep "$app"
            ditto -c -k --keepParent "$app" "$GITHUB_WORKSPACE/neforum-macos-$label.zip"
            ln -s /Applications "$out/dmg/Applications"
            hdiutil create -volname NEFORUM -srcfolder "$out/dmg" -ov -format UDZO "$GITHUB_WORKSPACE/NEFORUM-macOS-$label.dmg"
          }
          thin arm64 apple-silicon
          thin x86_64 intel
          ls -l "$GITHUB_WORKSPACE"/*.dmg "$GITHUB_WORKSPACE"/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: neforum-macos
          path: |
            neforum-macos*.zip
            NEFORUM-macOS*.dmg

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # PDFium comes from a GitHub release download in pdfium_dart's build hook,
      # which skips it when the library is already in the shared hook output: a
      # 504 from GitHub's download server once failed six jobs of the v1.4.2 tag run.
      - name: Cache PDFium (pdfium_dart build hook)
        uses: actions/cache@v4
        with:
          path: apps/neforum_app/.dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/neforum_app/pubspec.lock') }}
      # pdfium_dart's build hook downloads PDFium from a GitHub release address
      # that answered 504 for an hour on 2026-11-09 (six failed jobs of the
      # v1.4.2 tag run). This puts the libraries where the hook looks first,
      # through the GitHub API with retries: see tool/prefetch_pdfium.sh.
      - name: PDFium for the build hook (GitHub API, retried)
        working-directory: apps/neforum_app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: flutter pub get > /dev/null && bash tool/prefetch_pdfium.sh mac-arm64 || echo "::warning::PDFium prefetch failed; the build hook will try its own download"
      - name: Build unsigned IPA
        working-directory: apps/neforum_app
        run: |
          flutter pub get
          dart run tool/sync_docs.dart
          # Flutter's --no-codesign still lets Xcode ask for a signing team on
          # some targets ("requires a selected Development Team"), so Flutter
          # only prepares the project and Xcode builds with signing off for
          # every target.
          flutter build ios --release --no-codesign --config-only --dart-define=NEFORUM_MOBILE=true
          # Swift packages (PDFium's xcframework is a GitHub release download), retried on network failures only.
          bash tool/retry_on_network.sh 4 xcodebuild -resolvePackageDependencies -workspace ios/Runner.xcworkspace -scheme Runner -derivedDataPath build/ios-unsigned
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios-unsigned \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
          mkdir -p Payload
          cp -R build/ios-unsigned/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qr "$GITHUB_WORKSPACE/neforum-ios-unsigned.ipa" Payload
      - name: The Live Activity extension is in the IPA
        working-directory: apps/neforum_app
        run: |
          test -d Payload/Runner.app/PlugIns/NeforumLiveActivity.appex
          plutil -lint Payload/Runner.app/PlugIns/NeforumLiveActivity.appex/Info.plist
          plutil -lint Payload/Runner.app/Info.plist
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw Payload/Runner.app/PlugIns/NeforumLiveActivity.appex/Info.plist)" = com.apple.widgetkit-extension
          # Runner still starts on iOS 15, which has no ActivityKit.
          otool -l Payload/Runner.app/Runner | grep -A2 LC_LOAD_WEAK_DYLIB | grep -q ActivityKit
      - uses: actions/upload-artifact@v4
        with:
          name: neforum-ios-unsigned
          path: neforum-ios-unsigned.ipa

  # Proves on a simulator with a Dynamic Island that the activity starts from a real
  # channel call and that the stale words appear with nothing updating it. No release
  # waits on this job: a simulator is not a phone, and it may need adjusting per Xcode.
  ios-live-activity:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # PDFium comes from a GitHub release download in pdfium_dart's build hook,
      # which skips it when the library is already in the shared hook output: a
      # 504 from GitHub's download server once failed six jobs of the v1.4.2 tag run.
      - name: Cache PDFium (pdfium_dart build hook)
        uses: actions/cache@v4
        with:
          path: apps/neforum_app/.dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/neforum_app/pubspec.lock') }}
      # pdfium_dart's build hook downloads PDFium from a GitHub release address
      # that answered 504 for an hour on 2026-11-09 (six failed jobs of the
      # v1.4.2 tag run). This puts the libraries where the hook looks first,
      # through the GitHub API with retries: see tool/prefetch_pdfium.sh.
      - name: PDFium for the build hook (GitHub API, retried)
        working-directory: apps/neforum_app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: flutter pub get > /dev/null && bash tool/prefetch_pdfium.sh mac-arm64 || echo "::warning::PDFium prefetch failed; the build hook will try its own download"
      - name: Start the activity, send the app away, read the island
        working-directory: apps/neforum_app
        run: |
          flutter pub get
          dart run tool/sync_docs.dart
          bash tool/ci_live_activity_simulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-live-activity-screenshots
          path: |
            apps/neforum_app/build/live-activity/*.png
            apps/neforum_app/build/live-activity/*.txt
            apps/neforum_app/build/live-activity/*.log

  web-preview:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # PDFium comes from a GitHub release download in pdfium_dart's build hook,
      # which skips it when the library is already in the shared hook output: a
      # 504 from GitHub's download server once failed six jobs of the v1.4.2 tag run.
      - name: Cache PDFium (pdfium_dart build hook)
        uses: actions/cache@v4
        with:
          path: apps/neforum_app/.dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/neforum_app/pubspec.lock') }}
      - name: Linux packages for the tray plugin's build hook
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      # pdfium_dart's build hook downloads PDFium from a GitHub release address
      # that answered 504 for an hour on 2026-11-09 (six failed jobs of the
      # v1.4.2 tag run). This puts the libraries where the hook looks first,
      # through the GitHub API with retries: see tool/prefetch_pdfium.sh.
      - name: PDFium for the build hook (GitHub API, retried)
        working-directory: apps/neforum_app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: flutter pub get > /dev/null && bash tool/prefetch_pdfium.sh linux-x64 || echo "::warning::PDFium prefetch failed; the build hook will try its own download"
      - name: Build web preview (demo workspace)
        working-directory: apps/neforum_app
        run: |
          flutter pub get
          dart run tool/sync_docs.dart
          flutter build web --release --pwa-strategy=none
      - uses: actions/upload-artifact@v4
        with:
          name: neforum-web-preview
          path: apps/neforum_app/build/web

  # Linux desktop: a tarball and an AppImage per processor. Built on the
  # oldest supported Ubuntu, so the binaries run on distributions with an
  # older glibc too. The arm64 build is extra: if it fails, the release still
  # goes out with x64 only.
  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            appimage-arch: x86_64
            # https://github.com/AppImage/appimagetool/releases/tag/1.9.1 and
            # https://github.com/AppImage/type2-runtime/releases/tag/20251108
            appimagetool-sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime-sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: arm64
            runner: ubuntu-22.04-arm
            appimage-arch: aarch64
            appimagetool-sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime-sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    env:
      APPIMAGETOOL_VERSION: '1.9.1'
      APPIMAGE_RUNTIME_VERSION: '20251108'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # PDFium comes from a GitHub release download in pdfium_dart's build hook,
      # which skips it when the library is already in the shared hook output: a
      # 504 from GitHub's download server once failed six jobs of the v1.4.2 tag run.
      - name: Cache PDFium (pdfium_dart build hook)
        uses: actions/cache@v4
        with:
          path: apps/neforum_app/.dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/neforum_app/pubspec.lock') }}
      # Flutter publishes no SDK archive for Linux on arm64; the Git checkout of
      # the same release fetches the arm64 Dart SDK and engine itself.
      - name: Flutter SDK (arm64, from the release tag)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Linux build packages
        run: |
          sudo apt-get update
          # Toolchain and GTK (Flutter), libsecret (keyring), WebKitGTK and
          # libsoup (sign-in windows), X11/Xi (the tray plugin's build hook),
          # libayatana-appindicator (tray hosts), Xvfb, D-Bus and GNOME Keyring
          # (integration tests without a desktop).
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev libsecret-1-dev libx11-dev libxi-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            xvfb xauth dbus-x11 gnome-keyring libgl1-mesa-dri file xdotool
      # pdfium_dart's build hook downloads PDFium from a GitHub release address
      # that answered 504 for an hour on 2026-11-09 (six failed jobs of the
      # v1.4.2 tag run). This puts the libraries where the hook looks first,
      # through the GitHub API with retries: see tool/prefetch_pdfium.sh.
      - name: PDFium for the build hook (GitHub API, retried)
        working-directory: apps/neforum_app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: flutter pub get > /dev/null && bash tool/prefetch_pdfium.sh linux-${{ matrix.arch }} || echo "::warning::PDFium prefetch failed; the build hook will try its own download"
      - name: Build Linux
        working-directory: apps/neforum_app
        run: |
          flutter --version
          flutter pub get
          dart run tool/sync_docs.dart
          flutter build linux --release
          ls -l "build/linux/${{ matrix.arch }}/release/bundle"
          file "build/linux/${{ matrix.arch }}/release/bundle/NEFORUM"
          # 1.4.2: nothing in the bundle may need WebKitGTK. It is not installed
          # everywhere (the AppImage catalog's test system), and a missing one
          # stopped NEFORUM from starting at all; Linux signs in without it.
          bundle="build/linux/${{ matrix.arch }}/release/bundle"
          for f in "$bundle/NEFORUM" "$bundle"/lib/*.so; do
            if ldd "$f" | grep -Ei 'webkit|javascriptcore'; then
              echo "::error::$f needs WebKitGTK: see linux/runner/webview_stub.cc"; exit 1
            fi
          done
          ls -l "$bundle/lib/libdesktop_webview_window_plugin.so"
      # The real Linux build under an X server, with a Secret Service (GNOME
      # Keyring) on a private session bus: first run, every section, the
      # keyring, the demo workspace, a text card, the clipboard. Then the
      # caption and text card renders on a profile (AOT) build, as shipped.
      - name: Integration tests (real Linux build, X server, keyring)
        if: matrix.arch == 'x64'
        working-directory: apps/neforum_app
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "neforum-ci" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            xvfb-run -a -s "-screen 0 1920x1080x24" flutter test integration_test/desktop_app_test.dart -d linux
            xvfb-run -a -s "-screen 0 1920x1080x24" flutter drive --profile -d linux \
              --driver=test_driver/integration_test.dart --target=integration_test/captions_test.dart
            xvfb-run -a -s "-screen 0 1920x1080x24" flutter drive --profile -d linux \
              --driver=test_driver/integration_test.dart --target=integration_test/font_downloads_test.dart
          '
      # xdotool click 8 and 9 on the profile build, on Xvfb's private display,
      # where NEFORUM is the only window a click can reach.
      - name: Mouse side buttons (profile build, X server, xdotool)
        if: matrix.arch == 'x64'
        working-directory: apps/neforum_app
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "neforum-ci" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            NEFORUM_XDOTOOL_LANE=1 xvfb-run -a -s "-screen 0 1920x1080x24" flutter drive --profile -d linux \
              --driver=test_driver/integration_test.dart --target=integration_test/back_forward_test.dart
          '
      - name: Package (tarball and AppImage)
        working-directory: apps/neforum_app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="$PWD/build/linux/${{ matrix.arch }}/release/bundle"
          pkg="$GITHUB_WORKSPACE/packaging/linux"

          # Tarball: the bundle in a NEFORUM folder, with the .desktop file,
          # AppStream metadata and icons (the Flatpak manifest builds from it).
          stage="$RUNNER_TEMP/tarball/NEFORUM"
          rm -rf "$RUNNER_TEMP/tarball" && mkdir -p "$stage"
          cp -a "$bundle"/. "$stage"/
          cp "$pkg/org.neforum.NEFORUM.desktop" "$pkg/org.neforum.NEFORUM.metainfo.xml" "$stage"/
          cp -a "$pkg/icons" "$stage"/
          tar -C "$RUNNER_TEMP/tarball" --owner=0 --group=0 -czf "$GITHUB_WORKSPACE/neforum-linux-${{ matrix.arch }}.tar.gz" NEFORUM

          # AppImage, with appimagetool and its runtime from pinned releases.
          tools="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools"
          # Through the GitHub API with the job's token, retried: anonymous
          # release downloads timed out for an hour on 2026-11-09 (GitHub's
          # "surge in anonymous users" incident) and failed the v1.4.2 tag run.
          # The pinned hashes below still check every byte.
          release_get() {
            if ! command -v gh > /dev/null; then
              curl -fsSL --retry 6 --retry-all-errors --retry-delay 20 -o "$4" "https://github.com/$1/releases/download/$2/$3"
              return
            fi
            for attempt in 1 2 3 4 5 6; do
              gh release download "$2" --repo "$1" --pattern "$3" --output "$4" --clobber && return 0
              echo "release download $1 $3: attempt $attempt failed" >&2
              sleep $((attempt * 15))
            done
            return 1
          }
          raw_get() {
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 20 -H "Authorization: Bearer $GH_TOKEN" -o "$1" "$2"
          }
          release_get AppImage/appimagetool "$APPIMAGETOOL_VERSION" "appimagetool-${{ matrix.appimage-arch }}.AppImage" "$tools/appimagetool"
          release_get AppImage/type2-runtime "$APPIMAGE_RUNTIME_VERSION" "runtime-${{ matrix.appimage-arch }}" "$tools/runtime"
          echo "${{ matrix.appimagetool-sha256 }}  $tools/appimagetool" | sha256sum -c -
          echo "${{ matrix.runtime-sha256 }}  $tools/runtime" | sha256sum -c -
          chmod +x "$tools/appimagetool"

          appdir="$RUNNER_TEMP/NEFORUM.AppDir"
          rm -rf "$appdir" && mkdir -p "$appdir/usr/share/applications" "$appdir/usr/share/metainfo"
          cp -a "$bundle"/. "$appdir"/
          ln -s NEFORUM "$appdir/AppRun"
          cp "$pkg/org.neforum.NEFORUM.desktop" "$appdir"/
          cp "$pkg/org.neforum.NEFORUM.desktop" "$appdir/usr/share/applications"/
          cp "$pkg/org.neforum.NEFORUM.metainfo.xml" "$appdir/usr/share/metainfo/org.neforum.NEFORUM.appdata.xml"
          cp -a "$pkg/icons" "$appdir/usr/share"/
          cp "$pkg/icons/hicolor/256x256/apps/org.neforum.NEFORUM.png" "$appdir/org.neforum.NEFORUM.png"
          ln -s org.neforum.NEFORUM.png "$appdir/.DirIcon"
          # The AppImage catalog's own lint (appimage.github.io), pinned by commit
          # and hash, with this Ubuntu's desktop-file-validate and appstreamcli:
          # 1.4.0 failed the catalog on a .desktop key these older tools reject.
          # mimetype (libfile-mimeinfo-perl): the lint checks .DirIcon is a PNG with it, as the catalog does.
          sudo apt-get install -y desktop-file-utils appstream libfile-mimeinfo-perl > /dev/null
          raw_get "$tools/appdir-lint.sh" \
            "https://raw.githubusercontent.com/AppImage/appimage.github.io/43bfa8028da03218288d73bbdf45fda2e18c98c5/code/appdir-lint.sh"
          raw_get "$tools/excludelist" \
            "https://raw.githubusercontent.com/AppImage/AppImages/15a64c20dc23a0154622ba25829364323903b6b5/excludelist"
          echo "835eb24ca7be3c7af028b6342aebe67f184759be2e54a865d246e6122535c476  $tools/appdir-lint.sh" | sha256sum -c -
          echo "50db0f894f34b169c47a5cbc0c17dbab61e9edebca5bc8269a1e6ac1bf4bdad9  $tools/excludelist" | sha256sum -c -
          # Retried only on a network failure: its link check fetches github.com.
          EXCLUDELIST="$tools/excludelist" bash "$GITHUB_WORKSPACE/apps/neforum_app/tool/retry_on_network.sh" 4 bash "$tools/appdir-lint.sh" "$appdir"
          # --appimage-extract-and-run: CI runners have no FUSE.
          ARCH=${{ matrix.appimage-arch }} "$tools/appimagetool" --appimage-extract-and-run --no-appstream \
            --runtime-file "$tools/runtime" "$appdir" "$GITHUB_WORKSPACE/NEFORUM-${{ matrix.appimage-arch }}.AppImage"
          ls -l "$GITHUB_WORKSPACE"/neforum-linux-*.tar.gz "$GITHUB_WORKSPACE"/NEFORUM-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: neforum-linux-${{ matrix.arch }}
          path: |
            neforum-linux-${{ matrix.arch }}.tar.gz
            NEFORUM-${{ matrix.appimage-arch }}.AppImage

  # The browser extension: its tests, AMO's linter on the Firefox build, and
  # (with AMO credentials, docs/signing.md) a Firefox build signed by Mozilla
  # for self-distribution. Without them the Firefox zip ships unsigned.
  browser-extension:
    needs: test
    runs-on: ubuntu-latest
    env:
      WEB_EXT_VERSION: '10.7.0'
      AMO_CONFIGURED: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # PDFium comes from a GitHub release download in pdfium_dart's build hook,
      # which skips it when the library is already in the shared hook output: a
      # 504 from GitHub's download server once failed six jobs of the v1.4.2 tag run.
      - name: Cache PDFium (pdfium_dart build hook)
        uses: actions/cache@v4
        with:
          path: apps/neforum_app/.dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/neforum_app/pubspec.lock') }}
      - name: Linux packages for the tray plugin's build hook
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      - name: Extension tests
        run: node --test extensions/browser/test/background.test.mjs extensions/browser/test/content.test.mjs extensions/browser/test/main.test.mjs
      - name: Extension test pages in headless Chrome (real clicks)
        run: node extensions/browser/test/pages.mjs "$(command -v google-chrome || command -v chromium)"
      # pdfium_dart's build hook downloads PDFium from a GitHub release address
      # that answered 504 for an hour on 2026-11-09 (six failed jobs of the
      # v1.4.2 tag run). This puts the libraries where the hook looks first,
      # through the GitHub API with retries: see tool/prefetch_pdfium.sh.
      - name: PDFium for the build hook (GitHub API, retried)
        working-directory: apps/neforum_app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: flutter pub get > /dev/null && bash tool/prefetch_pdfium.sh linux-x64 || echo "::warning::PDFium prefetch failed; the build hook will try its own download"
      - name: Build the Chrome and Firefox extensions
        working-directory: apps/neforum_app
        run: |
          flutter pub get
          dart run tool/build_extension.dart
          cp ../../dist/neforum-extension-*.zip "$GITHUB_WORKSPACE"/
          # The bundled copies in assets/ must match the extension's source.
          git diff --exit-code -- assets/browser-extension || { echo "::error::Run dart run tool/build_extension.dart and commit assets/browser-extension"; exit 1; }
      - name: AMO lint (Firefox build)
        # Errors fail the build; warnings (such as data_collection_permissions
        # needing Firefox 140, older versions ignore the key) are listed only.
        run: npx --yes "web-ext@$WEB_EXT_VERSION" lint --source-dir apps/neforum_app/assets/browser-extension/firefox
      - name: Sign the Firefox build (AMO, unlisted)
        # Tags only: AMO signs each version once, and a push to main and its tag
        # run at the same time. A failed signing ships the unsigned zip.
        if: env.AMO_CONFIGURED == 'true' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          src="apps/neforum_app/assets/browser-extension/firefox"
          version="$(jq -r .version "$src/manifest.json")"
          out="$GITHUB_WORKSPACE/neforum-extension-firefox-$version.xpi"
          # AMO signs each version once. A version an earlier release already
          # shipped signed is taken from that release, after checking that its
          # files are exactly this build's (a changed extension needs a new
          # version number).
          for tag in $(gh release list --limit 50 --json tagName --jq '.[].tagName'); do
            if gh release download "$tag" --pattern "neforum-extension-firefox-$version.xpi" --output "$out" 2> /dev/null; then
              echo "Signed $version found in release $tag."
              break
            fi
          done
          if [ -f "$out" ]; then
            check="$RUNNER_TEMP/signed-check"
            rm -rf "$check" && mkdir -p "$check" && unzip -q "$out" -d "$check" && rm -rf "$check/META-INF"
            diff -r "$check" "$src" || { echo "::error::The extension changed but is still version $version: raise its version"; exit 1; }
          else
            npx --yes "web-ext@$WEB_EXT_VERSION" sign --channel unlisted --source-dir "$src" \
              --artifacts-dir "$RUNNER_TEMP/web-ext-signed" --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
            cp "$RUNNER_TEMP"/web-ext-signed/*.xpi "$out"
          fi
          # One Firefox download per release: the signed one.
          rm -f "$GITHUB_WORKSPACE/neforum-extension-firefox-$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: neforum-browser-extension
          path: |
            neforum-extension-*.zip
            neforum-extension-*.xpi
          if-no-files-found: error

  # Windows code signing through SignPath Foundation (free for open source;
  # docs/signing.md). Runs for release tags once the repository variable
  # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN exist: signs
  # NEFORUM.exe, builds the installer again around the signed app, signs the
  # installer, and zips the signed app. The release then ships these instead
  # of the unsigned ones.
  windows-signing:
    needs: windows
    permissions:
      contents: read
      actions: read
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    env:
      # Secrets cannot appear in `if:`; this flag can.
      SIGNPATH_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - name: Signing configuration
        shell: pwsh
        run: |
          if ($env:SIGNPATH_CONFIGURED -ne 'true') { Write-Output "::error::SIGNPATH_ORGANIZATION_ID is set but the secret SIGNPATH_API_TOKEN is missing"; exit 1 }
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neforum-windows
          path: unsigned
      - name: Unpack the app
        shell: pwsh
        run: Expand-Archive unsigned/neforum-windows.zip -DestinationPath app-unsigned
      - id: app-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: neforum-windows-app-unsigned
          path: app-unsigned/
          retention-days: 1
      - name: Sign NEFORUM.exe (SignPath)
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION || 'app' }}
          github-artifact-id: ${{ steps.app-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # A release signing policy waits for an approver.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: app-signed
      - name: Installer and zip from the signed app
        shell: pwsh
        run: |
          $exe = Get-AuthenticodeSignature app-signed/NEFORUM.exe
          if ($exe.Status -ne 'Valid') { Write-Output "::error::NEFORUM.exe is not validly signed: $($exe.Status)"; exit 1 }
          Write-Output "NEFORUM.exe signed by $($exe.SignerCertificate.Subject)"
          $release = 'apps/neforum_app/build/windows/x64/runner/Release'
          New-Item -ItemType Directory -Force $release | Out-Null
          Copy-Item -Recurse app-signed/* $release
          Compress-Archive -Path "$release/*" -DestinationPath neforum-windows.zip
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = ((Select-String -Path apps/neforum_app/pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          & $iscc "/DAppVersion=$version" apps/neforum_app/installer/neforum.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: installer-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: neforum-windows-installer-unsigned
          path: apps/neforum_app/build/installer/NEFORUM-Setup-*.exe
          retention-days: 1
      - name: Sign the installer (SignPath)
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION || 'installer' }}
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: installer-signed
      - name: Check the signed installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer-signed -Filter 'NEFORUM-Setup-*.exe' | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $setup.FullName
          if ($sig.Status -ne 'Valid') { Write-Output "::error::$($setup.Name) is not validly signed: $($sig.Status)"; exit 1 }
          Copy-Item $setup.FullName .
      - uses: actions/upload-artifact@v4
        with:
          name: neforum-windows-signed
          path: |
            neforum-windows.zip
            NEFORUM-Setup-*.exe
          if-no-files-found: error

  release:
    # windows-signing is skipped until SignPath is set up; a skipped job must
    # not stop the release, a failed one does.
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [android, windows, macos, ios, linux, browser-extension, windows-signing]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestations (actions/attest-build-provenance).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # Only the downloads: the web preview's files are not release assets.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: neforum-{android,windows,macos,ios-unsigned,linux-x64,linux-arm64}
          merge-multiple: true
      # The extension comes from its own job (tested, linted, signed for
      # Firefox when AMO credentials exist), not from the Windows job's copy.
      - name: Drop the Windows job's extension zips
        run: rm -f dist/neforum-extension-*
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: neforum-browser-extension
      # Signed Windows files replace the unsigned ones (same names).
      - uses: actions/download-artifact@v4
        if: needs.windows-signing.result == 'success'
        with:
          path: dist
          name: neforum-windows-signed
      - uses: dart-lang/setup-dart@v1
      # Release notes (the published release's, or GitHub's generated ones),
      # SHA256SUMS of every download, and latest.json for the update check
      # (published here as an asset; neforus.com serves a copy).
      - name: Release notes, SHA256SUMS and latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh api "repos/$GH_REPO/releases/tags/$tag" > /dev/null 2>&1; then
            gh api "repos/$GH_REPO/releases/tags/$tag" --jq .body > "$RUNNER_TEMP/notes.md"
          else
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$tag" --jq .body > "$RUNNER_TEMP/notes.md"
          fi
          (cd dist && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
          # Run from outside the app package: `dart` would otherwise resolve the
          # package's Flutter dependencies first (the script needs none).
          cp apps/neforum_app/tool/make_latest_json.dart "$RUNNER_TEMP/"
          dart "$RUNNER_TEMP/make_latest_json.dart" --version "${tag#v}" --sums dist/SHA256SUMS \
            --notes "$RUNNER_TEMP/notes.md" --base-url "https://github.com/$GH_REPO/releases/download/$tag" \
            --output dist/latest.json
          cat dist/SHA256SUMS
      # A signed statement, verifiable with `gh attestation verify <file>
      # --repo Neforuss/NEFORUM`, that each file was built by this workflow
      # from this commit.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      # A published release of this tag gets its files replaced. Otherwise a new
      # one is made as a draft: the maintainer installs the version, mirrors these
      # files to neforus.com, then publishes it (`gh release edit <tag>
      # --draft=false --latest`), so GitHub is last. Drafts are never reused, so a
      # half-uploaded one can't leak.
      - name: Upload the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          tag="$GITHUB_REF_NAME"
          if gh api "repos/$GH_REPO/releases/tags/$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "NEFORUM ${tag#v}"
          else
            gh release create "$tag" dist/* --title "NEFORUM ${tag#v}" --notes-file "$RUNNER_TEMP/notes.md" --draft
          fi
